RateSearchTask:
  description: Search for the latest exchange rates for USD, EUR, GBP, JPY, and CAD
    against the Brazilian Real (BRL) on the reliable Xe.com exchange rates webpage.
  expected_output: Exchange rates in JSON format
  agent: Financial Analyst
  output_file: output/xe_exchange_rates.json
MarketAnalysisTask:
  description: Extract exchange rate insights using web scraping to analyze market
    trends and create a concise market analysis in JSON format.
  expected_output: Market analysis in JSON format
  agent: Financial Analyst
  output_file: output/market_analysis.json
